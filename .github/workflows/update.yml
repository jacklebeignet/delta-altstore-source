name: Update source

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source.json"
      - "template.json"
      - "main.luau"
      - "assets/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Build source.json
        run: lune run main.luau

      - name: Stage vendored assets for Pages (belt-and-suspenders if Lune copy missed)
        run: mkdir -p public/assets && cp -f assets/* public/assets/ && ls -lh public public/assets

      - name: Commit updated source.json + new assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json assets
          git diff --staged --quiet || git commit -m "chore: update source"
          git push || echo "nothing to push or push failed (e.g. no upstream yet)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
